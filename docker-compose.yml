services:
  dasec-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dasec-api
    ports:
      - "8001:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VT_API_KEY=${VT_API_KEY}
      - ABUSEIPDB_KEY=${ABUSEIPDB_KEY}
      - SLACK_TOKEN=${SLACK_TOKEN}
      - BASE_DIR=/app
      - VECTORSTORE_DIR=/app/data/vectorstore
      - IOC_CACHE_DIR=/app/data/ioc_cache
      - DB_PATH=/app/data/dasec.db
      - PDF_OUTPUT_DIR=/tmp/dasec_reports
      - BERT_PATH=/app/models/distilbert-5000/final
      - TFIDF_PATH=/app/models/tfidf_lr_pipeline.pkl
    volumes:
      - ./models:/app/models:ro
      - ./data/vectorstore:/app/data/vectorstore
      - ./data/ioc_cache:/app/data/ioc_cache
      - ./data:/app/data:rw
      - ./reports:/tmp/dasec_reports:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
